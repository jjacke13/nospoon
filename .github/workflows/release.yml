name: Release nospoon-cpp binaries

# Build the nospoon-cpp single binary for every supported platform and
# publish them as release assets. Tag a commit with `v*` (e.g. `v0.5.0`)
# to trigger a release; the workflow_dispatch entry below allows manual
# runs that only produce build artifacts.
#
# Every target ships TWO variants:
#   release — HYPERDHT_DEBUG=OFF. What users install.
#   debug   — HYPERDHT_DEBUG=ON. Verbose DHT_LOG to stderr (holepunch
#             rounds, announce cycles, peer addresses). For diagnosing a
#             field failure; it prints peer addresses, so it is not the
#             default download.
#
# Linux artifacts are fully-static musl single binaries built from the
# flake (`.#nospoon-cpp-<arch>[-debug]`): zero runtime deps, no
# glibc-version risk, and byte-identical to what `nix build` gives a
# developer. They are cross-compiled for aarch64 from the x86_64 runner,
# so no ARM runner is needed.
#
# macOS builds with the platform toolchain — there is no musl-static
# equivalent there, so libsodium/libuv stay dynamic.
#
# Windows uses vcpkg's x64-windows-static triplet, which links the MSVC
# runtime in too, so the archive is nospoon.exe plus wintun.dll and
# nothing else. Every remaining import is a stock-Windows DLL.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # Needed by softprops/action-gh-release on tag runs

jobs:
  # ====================================================================
  # Linux — static musl single binaries, both variants, from the flake.
  # ====================================================================
  linux:
    name: Build (linux-${{ matrix.arch }}-${{ matrix.variant }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: [release, debug]
    steps:
      - uses: actions/checkout@v4

      # The runner is x86_64. The flake has no cross outputs — every output
      # is native to its own `packages.<system>` — so the ARM64 build runs
      # under emulation. This registers the aarch64 binfmt handler with the
      # F (fix-binary) flag, which is what makes it work inside the Nix
      # build sandbox. Harmless on the x86_64 leg.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux
            # The aarch64 musl-static closure is NOT on cache.nixos.org
            # (its libuv-static-aarch64 narinfo 404s). Without this
            # substituter the ARM job rebuilds that whole toolchain under
            # emulation, and libuv's own test suite fails there — qemu gets
            # its timing/process tests wrong. With it, the job substitutes
            # the same paths a local build does and never compiles them.
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Build
        run: |
          # Always the explicit per-system attribute, never the bare
          # `.#nospoon-cpp` (which would follow the runner's architecture).
          attr=".#packages.${{ matrix.arch }}-linux.nospoon-cpp"
          [ "${{ matrix.variant }}" = "debug" ] && attr="$attr-debug"
          echo "building $attr"
          nix build "$attr" -L
          cp result/bin/nospoon ./nospoon

      - name: Verify it is a true single binary
        run: |
          chmod +w nospoon
          file nospoon
          # No NEEDED entries and no interpreter — otherwise it is not
          # standalone and must not ship as one.
          if readelf -d nospoon 2>/dev/null | grep -q NEEDED; then
            echo "::error::binary has dynamic dependencies"; exit 1
          fi
          if readelf -l nospoon 2>/dev/null | grep -q INTERP; then
            echo "::error::binary has a dynamic interpreter"; exit 1
          fi
          # The debug build must contain DHT_LOG markers; the release
          # build must not. Catches a variant silently building wrong.
          n=$(strings nospoon | grep -c '\[announcer\]' || true)
          echo "DHT_LOG markers: $n"
          if [ "${{ matrix.variant }}" = "debug" ] && [ "$n" -eq 0 ]; then
            echo "::error::debug variant has no DHT_LOG markers"; exit 1
          fi
          if [ "${{ matrix.variant }}" = "release" ] && [ "$n" -ne 0 ]; then
            echo "::error::release variant contains DHT_LOG markers"; exit 1
          fi

      - name: Stage
        run: |
          name=nospoon-linux-${{ matrix.arch }}-${{ matrix.variant }}
          mkdir -p "dist/$name"
          cp nospoon "dist/$name/"
          chmod +x "dist/$name/nospoon"
          cp LICENSE README.md config.example.jsonc "dist/$name/"
          ls -lh "dist/$name/"
          ( cd dist && tar -czf "$name.tar.gz" "$name" )

      - uses: actions/upload-artifact@v4
        with:
          name: nospoon-linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: dist/nospoon-linux-${{ matrix.arch }}-${{ matrix.variant }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ====================================================================
  # macOS — platform toolchain. No static-musl equivalent; libsodium and
  # libuv come from brew and stay dynamic.
  # ====================================================================
  macos:
    name: Build (macos-aarch64-${{ matrix.variant }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew update
          # NOT libuv from brew. Homebrew ships 1.52.x, which has the UDP
          # POLLERR regression (libuv #4902 / #5030) that silently wedges
          # established streams on real paths — that is how libuv 1.52.1
          # got into the v0.5.0 Windows binaries. Homebrew has no libuv@1.51
          # formula to pin to, so build 1.51.0 from source; it takes seconds.
          brew install cmake ninja pkg-config libsodium

      - name: Build libuv 1.51.0
        run: |
          curl -fsSL -o libuv.tar.gz \
            https://github.com/libuv/libuv/archive/refs/tags/v1.51.0.tar.gz
          tar xzf libuv.tar.gz
          cmake -S libuv-1.51.0 -B libuv-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/libuv" \
            -DLIBUV_BUILD_TESTS=OFF \
            -DLIBUV_BUILD_BENCH=OFF
          cmake --build libuv-build --target install

      - name: Configure + build
        # CMAKE_PREFIX_PATH and PKG_CONFIG_PATH both point at the 1.51.0
        # install: nospoon's guard finds headers through the former, and
        # hyperdht-cpp resolves libuv through pkg-config. Without both, a
        # brew libuv pulled in as some other formula's dependency wins.
        run: |
          dbg=OFF
          [ "${{ matrix.variant }}" = "debug" ] && dbg=ON
          export PKG_CONFIG_PATH="$HOME/libuv/lib/pkgconfig"
          cmake -S cpp -B cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHYPERDHT_DEBUG=$dbg \
            -DCMAKE_PREFIX_PATH="$HOME/libuv"
          cmake --build cpp/build -j

      - name: Stage
        run: |
          name=nospoon-macos-aarch64-${{ matrix.variant }}
          mkdir -p "dist/$name"
          cp cpp/build/nospoon "dist/$name/"
          chmod +x "dist/$name/nospoon"
          cp LICENSE README.md config.example.jsonc "dist/$name/"
          ls -lh "dist/$name/"
          ( cd dist && tar -czf "$name.tar.gz" "$name" )

      - uses: actions/upload-artifact@v4
        with:
          name: nospoon-macos-aarch64-${{ matrix.variant }}
          path: dist/nospoon-macos-aarch64-${{ matrix.variant }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ====================================================================
  # Windows — clang-cl + vcpkg x64-windows-static (fully static CRT).
  # Archive is nospoon.exe plus wintun.dll, which tun_windows.cpp loads at
  # runtime via LoadLibraryW; everything else is a stock-Windows DLL.
  # ====================================================================
  windows:
    name: Build (windows-x86_64-${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        # Puts cl.exe + the MSVC headers / libs on PATH so the Ninja
        # generator picks them up instead of the MinGW GCC that's also
        # installed on the windows-latest runner. The vcpkg static-md
        # triplet below is MSVC-ABI and would fail to link otherwise.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare vcpkg (manifest mode)
        shell: pwsh
        run: |
          # vcpkg is pre-installed on GitHub-hosted Windows runners, and its
          # ports tree is whatever the image shipped. cpp/vcpkg.json carries
          # a `builtin-baseline` because `overrides` requires one, but that
          # baseline MUST match the runner's own checkout: vcpkg resolves
          # every transitive dependency against the baseline's version
          # database, so a baseline older than the ports tree fails with
          # "no version database entry for <transitive dep>" (seen with
          # pkgconf). x-update-baseline rewrites it to the local HEAD,
          # leaving the libuv override — the thing we actually care about —
          # untouched. libuv 1.51.0 stays resolvable because the version
          # database is append-only.
          vcpkg version
          vcpkg x-update-baseline --x-manifest-root=cpp
          Write-Host "--- cpp/vcpkg.json after baseline update ---"
          Get-Content cpp/vcpkg.json
          # No `vcpkg install` here: in manifest mode the CMake toolchain
          # installs cpp/vcpkg.json's dependencies at configure time, into
          # cpp/build/vcpkg_installed. Installing in classic mode as well
          # would pull the UNPINNED libuv and defeat the point.

      - name: Configure + build
        shell: pwsh
        # clang-cl (from Visual Studio's Clang component) instead of
        # MSVC's cl.exe: libudx uses the GCC extension `x ?: 1` (omitted
        # middle operand) which cl rejects; clang-cl accepts it while
        # producing MSVC-ABI objects compatible with the vcpkg triplet.
        #
        # x64-windows-static (NOT -static-md): also links the MSVC runtime
        # statically. The -md variant left MSVCP140.dll and VCRUNTIME140.dll
        # as imports — those ship with the VC++ Redistributable, which is
        # absent on a clean Windows install, so users hit "VCRUNTIME140.dll
        # was not found". Verified by objdump on the 2026-09-24 artifact.
        #
        # Configure is also where vcpkg resolves cpp/vcpkg.json and where
        # the libuv version guard in cpp/CMakeLists.txt runs, so a bad libuv
        # fails here rather than shipping.
        run: |
          $dbg = if ('${{ matrix.variant }}' -eq 'debug') { 'ON' } else { 'OFF' }
          cmake -S cpp -B cpp/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DHYPERDHT_DEBUG=$dbg `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build cpp/build -j

      - name: Verify only wintun.dll is a non-system import
        shell: pwsh
        # The whole point of the static triplet. dumpbin lists the PE import
        # table; everything left must be a DLL present on a stock Windows.
        # MSVCP140/VCRUNTIME140 come from the VC++ Redistributable and are
        # NOT — if they reappear, the archive is not self-contained.
        run: |
          $imports = (dumpbin /dependents cpp\build\nospoon.exe) -join "`n"
          Write-Host $imports
          foreach ($bad in @('MSVCP140', 'VCRUNTIME140', 'MSVCR')) {
            if ($imports -match $bad) {
              Write-Host "::error::nospoon.exe imports $bad — needs the VC++ Redistributable, not self-contained"
              exit 1
            }
          }

      - name: Stage
        shell: pwsh
        run: |
          $name = "nospoon-windows-x86_64-${{ matrix.variant }}"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item cpp\build\nospoon.exe $stage\
          Copy-Item cpp\bin\win32-x64\wintun.dll $stage\
          Copy-Item cpp\bin\win32-x64\LICENSE.txt $stage\wintun-LICENSE.txt
          Copy-Item LICENSE $stage\
          Copy-Item README.md $stage\
          Copy-Item config.example.jsonc $stage\
          Get-ChildItem $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: nospoon-windows-x86_64-${{ matrix.variant }}
          path: dist/nospoon-windows-x86_64-${{ matrix.variant }}.zip
          if-no-files-found: error
          retention-days: 30

  # ====================================================================
  # Collect every per-target archive and attach them to the GitHub
  # release that the tag triggered. Skipped on manual fires.
  # ====================================================================
  release:
    name: Publish GitHub release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -printf "%p (%s bytes)\n"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/nospoon-*.*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
