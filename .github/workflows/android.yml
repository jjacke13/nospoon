name: Build Android arm64-v8a binary

on:
  push:
    branches: [nospoon-cpp, main]
    paths:
      - 'cpp/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build autoconf automake libtool

      # ────────────────────────────────────────────────────────────────────
      # Cross-compile dependencies for android-26 / arm64-v8a.
      # Mirrors hyperdht-cpp/.github/workflows/build.yml (build-android-arm64)
      # so the same toolchain assumptions hold (NDK toolchain file,
      # static libsodium, static libuv).
      # ────────────────────────────────────────────────────────────────────

      - name: Cross-compile libsodium for Android
        run: |
          git clone --depth 1 --branch stable https://github.com/jedisct1/libsodium.git /tmp/libsodium
          cd /tmp/libsodium
          ./autogen.sh
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export NDK_PLATFORM=android-26
          export LIBSODIUM_FULL_BUILD=1
          dist-build/android-armv8-a.sh
          echo "SODIUM_PREFIX=/tmp/libsodium/libsodium-android-armv8-a+crypto" >> $GITHUB_ENV

      - name: Cross-compile libuv for Android
        run: |
          git clone --depth 1 --branch v1.51.0 https://github.com/libuv/libuv.git /tmp/libuv
          cmake -B /tmp/libuv-build -S /tmp/libuv -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DLIBUV_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/libuv-android
          ninja -C /tmp/libuv-build install
          UV_LIB=$(find /tmp/libuv-android/lib -name "*.a" | head -1)
          echo "UV_LIB=$UV_LIB" >> $GITHUB_ENV

      - name: Clone & build hyperdht-cpp for Android
        run: |
          git clone --depth 1 https://github.com/jjacke13/hyperdht-cpp.git /tmp/hyperdht-src
          cd /tmp/hyperdht-src
          git submodule update --init --recursive --depth 1
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DHYPERDHT_BUILD_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON \
            -DSODIUM_INCLUDE_DIR=$SODIUM_PREFIX/include \
            -DSODIUM_LIBRARY=$SODIUM_PREFIX/lib/libsodium.a \
            -DUV_INCLUDE_DIR=/tmp/libuv-android/include \
            -DUV_LIBRARY=$UV_LIB
          ninja -C build-android
          echo "HYPERDHT_SRC=/tmp/hyperdht-src" >> $GITHUB_ENV

      # ────────────────────────────────────────────────────────────────────
      # Build nospoon as a single statically-linked PIE executable.
      # Output is named `libnospoon.so` so Android's APK installer extracts
      # it into the per-ABI native lib directory (only `lib*.so` files are
      # extracted by default). It's still a real ELF executable — fork+exec'd
      # by NospoonVpnService via the libnospoon_exec.so JNI helper.
      # ────────────────────────────────────────────────────────────────────

      - name: Build nospoon for Android arm64-v8a
        run: |
          NDK=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p cpp/build-android
          $NDK/aarch64-linux-android26-clang++ \
            -std=gnu++20 -O2 -Wall -fPIE -pie -DNDEBUG \
            -I cpp \
            -I $HYPERDHT_SRC/include \
            -I $HYPERDHT_SRC/deps/libudx/include \
            -I /tmp/libuv-android/include \
            -I $SODIUM_PREFIX/include \
            cpp/main.cpp cpp/server.cpp cpp/client.cpp \
            cpp/full_tunnel_android.cpp \
            $HYPERDHT_SRC/build-android/libhyperdht.a \
            $HYPERDHT_SRC/build-android/libudx.a \
            $SODIUM_PREFIX/lib/libsodium.a $UV_LIB \
            -static-libstdc++ -llog -lm -ldl \
            -o cpp/build-android/libnospoon.so
          chmod +x cpp/build-android/libnospoon.so
          file cpp/build-android/libnospoon.so
          ls -la cpp/build-android/libnospoon.so

      - name: Smoke-check binary symbols
        run: |
          NDK=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          # Confirm it's a PIE ELF with our entry point and no surprise
          # dynamic deps (hyperdht/udx/sodium/uv must be statically linked).
          $NDK/llvm-readelf -d cpp/build-android/libnospoon.so | grep -E "NEEDED|FLAGS_1" || true
          $NDK/llvm-nm cpp/build-android/libnospoon.so | grep -E " T main$" || \
            (echo "ERROR: main symbol missing"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: nospoon-android-arm64
          path: cpp/build-android/libnospoon.so
          if-no-files-found: error
